# Nightly demo reset (ADR-0041, #217): wipes and reseeds the shared demo
# Household so every day starts from the same clean toy dataset. Targets the
# app's default balances-demo.fly.dev hostname (stable regardless of custom
# domain config) rather than a real domain name. The reset endpoint itself
# only exists when DEMO_MODE is set (ADR-0041) — everywhere else this would
# 404, so there is no environment-routing logic to get wrong here.
#
# Deliberately does NOT set `environment: demo` on the job: any job that
# references a GitHub Environment auto-registers a Deployment against it, and
# this workflow never deploys anything (it only POSTs to a reset endpoint on
# the already-running app) — that was stamping the `demo` Environment's
# deployment history with a bogus nightly entry pointing at whatever `main`
# HEAD happened to be, making demo look newer than the code actually running
# on it. DEMO_RESET_TOKEN is a plain repo secret instead — it's a low-blast-
# radius admin token scoped to wiping/reseeding demo data (recoverable by
# re-running the reset), not the Fly control-plane credential
# (FLY_API_TOKEN), which stays Environment-scoped for real deploys.
name: demo-reset
on:
  schedule:
    # 19:00 UTC = 02:00 Asia/Jakarta — a low-traffic hour for the app's
    # default locale/timezone (ADR-0035).
    - cron: '0 19 * * *'
  workflow_dispatch: {}

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger demo reset
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            https://balances-demo.fly.dev/api/admin/demo-reset \
            -H "Authorization: Bearer ${{ secrets.DEMO_RESET_TOKEN }}")
          if [ "$status" != "204" ]; then
            echo "::error::demo reset failed with status $status"
            exit 1
          fi
