# Deploy (ADR-0030, routing revised by ADR-0049). Deploy target is decoupled
# from release maturity:
#
#   push tag  v*-alpha.N / v*-rc.N / v*-beta.N  -> preview     (auto)
#   push tag  vX.Y.Z (bare)                      -> production  (dormant; prod deferred)
#   workflow_dispatch(tag)                        -> demo        (manual promote)
#
# The image is built exactly once on a tag push and pushed to GHCR, then Fly
# deploys that same image by reference (#354 — GHCR and Fly used to run
# independently-built artifacts). A demo promote reuses that already-built
# image (no rebuild), so demo runs byte-identical to what preview validated.
# `goose up` runs inside Fly as the release_command. Single-origin: the Go app
# serves the SPA, so there is no separate frontend deploy.
name: deploy
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to promote to demo (e.g. v0.9.0-alpha.1)'
        required: true
        type: string

jobs:
  route:
    runs-on: ubuntu-latest
    permissions:
      packages: read   # docker manifest inspect on the (public) GHCR image
    outputs:
      env: ${{ steps.pick.outputs.env }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      # A manual promote deploys an image that must already exist — fail loudly
      # and early if the input isn't a real, already-cut tag.
      - name: Validate promote target
        if: github.event_name == 'workflow_dispatch'
        run: |
          t='${{ inputs.tag }}'
          if [[ ! "$t" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::'$t' is not a valid version tag (e.g. v0.9.0-alpha.1)"; exit 1
          fi
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          if ! docker manifest inspect "ghcr.io/kerti/balances:$t" >/dev/null 2>&1; then
            echo "::error::no GHCR image ghcr.io/kerti/balances:$t — was that tag ever cut?"; exit 1
          fi
      - id: pick
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual promote: target is always demo, tag comes from the input.
            echo "env=demo" >> "$GITHUB_OUTPUT"
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            # Tag push: maturity no longer picks the target (ADR-0049) — every
            # pre-release goes to preview; a bare tag routes to the dormant
            # production env (no bare tags are cut while prod is deferred).
            t='${{ github.ref_name }}'
            echo "tag=$t" >> "$GITHUB_OUTPUT"
            if   [[ "$t" == *-alpha.* || "$t" == *-rc.* || "$t" == *-beta.* ]]; then
              echo "env=preview" >> "$GITHUB_OUTPUT"
            elif [[ "$t" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "env=production" >> "$GITHUB_OUTPUT"
            else
              echo "::error::tag $t matches no environment"; exit 1
            fi
          fi

  # Single build, reused by both Fly and self-hosters (#354, ADR-0033). Also
  # the operator artifact for `docker compose pull` (#225) — named for the
  # product (`balances`, not the `-v2` repo) so it's clean self-host copy.
  # Only runs on a tag push; a demo promote reuses this image from an earlier cut.
  # NOTE one-time setup: the GHCR package visibility must be flipped to public
  # (Packages -> balances -> Package settings -> Change visibility) so the
  # image is anonymously pullable; GITHUB_TOKEN cannot set that.
  build:
    needs: route   # fail fast on an unroutable tag before spending a build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          # Self-hosters run on arm64 too (Apple Silicon, Raspberry Pi, ARM
          # cloud VMs), so publish a multi-arch manifest. The Dockerfile cross-
          # compiles per target, so no QEMU emulation is needed.
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/kerti/balances:${{ github.ref_name }}
          # APP_VERSION is baked in (identical across every environment this
          # one build is deployed to). DEPLOY_ENV is NOT a build arg — it
          # varies per environment, so it's read at runtime instead (#354),
          # passed to Fly below via `flyctl deploy --env` and to self-hosters
          # via docker-compose.yml.
          build-args: |
            APP_VERSION=${{ github.ref_name }}

  deploy:
    needs: [route, build]
    # Runs on a tag push (after build) and on a manual promote (build skipped).
    if: ${{ always() && needs.route.result == 'success' && needs.build.result != 'failure' && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    environment: ${{ needs.route.outputs.env }}   # secrets + (production) approval gate
    concurrency: deploy-${{ needs.route.outputs.env }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master-pinned 2026-06-13
      - name: Deploy to ${{ needs.route.outputs.env }}
        # --image pins the exact digest from the tag's build — no rebuild, so
        # this is byte-identical to what self-hosters pull (#354) and to what
        # preview validated. fly.toml is still read for the rest of the app
        # config (checks, release_command). DEPLOY_ENV is a runtime env var,
        # not baked into the image.
        run: |
          flyctl deploy --app "balances-${{ needs.route.outputs.env }}" \
            --image "ghcr.io/kerti/balances:${{ needs.route.outputs.tag }}" \
            --env DEPLOY_ENV="${{ needs.route.outputs.env }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Verify the rolled-out version
        # flyctl deploy succeeding only proves one health check passed, not that
        # this tag is actually what's serving — /healthz.version is baked in the
        # build-arg above (#355). Poll the app's default *.fly.dev hostname
        # (stable regardless of any custom domain fronting the environment).
        run: |
          url="https://balances-${{ needs.route.outputs.env }}.fly.dev/healthz"
          want="${{ needs.route.outputs.tag }}"
          for i in $(seq 1 10); do
            got="$(curl -fsS "$url" | jq -r .version 2>/dev/null || true)"
            if [[ "$got" == "$want" ]]; then
              echo "verified: $url reports version $got"
              exit 0
            fi
            echo "attempt $i/10: got '$got', want '$want' — retrying in 5s"
            sleep 5
          done
          echo "::error::$url never reported version $want"
          exit 1
