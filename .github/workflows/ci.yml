name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main, 'feat/**']

permissions:
  contents: read

# Cancel a superseded run when a PR gets a new push. Non-PR runs get a unique
# group (run_id): a shared group would let a newer queued main run silently
# replace an older queued one, leaving a merge commit unchecked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# Every job runs on every PR — no path-gating. Codecov needs both the backend
# and frontend flags uploaded on every commit to report an accurate combined
# total; gating skipped one side and left Codecov carrying forward stale (or
# zero) coverage for the untouched half. Actions are free on this public repo,
# so always running both suites is the deterministic, no-cost guarantee.

jobs:
  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          # Kept cold on purpose alongside skip-cache below (SA5011 history).
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: backend
          # Don't reuse golangci-lint's analysis cache across runs. Incremental
          # reanalysis mixes stale cross-file staticcheck facts with fresh
          # results, which surfaced as phantom SA5011 (possible-nil-deref) reports
          # on an arbitrary subset of identical `c := findCookie(); if c == nil {
          # t.Fatal }; c.Value` test patterns — flagged in three files while the
          # byte-identical pattern in session_test.go went unreported, and never
          # reproducible on a clean local cache. A full recompute (~40s here) is
          # cheap insurance against these false positives.
          skip-cache: true

  backend-test:
    name: Backend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # fetch-depth: 0 — Codecov needs full history to resolve a PR's merge-base
      # commit. With the default shallow (depth-1) clone it can't, leaving the
      # comparison base unresolved ("missing a commit for that pull request") so
      # no PR coverage comment is posted. Only the coverage-uploading jobs
      # (this one + Frontend checks) need it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go-cached
        id: go
        with:
          flavour: test
      # -count=1: the restored build cache also holds test results, and Go's
      # result cache can't see non-Go inputs (the testcontainers Postgres image),
      # so without it an unchanged-Go PR replays results instead of running tests.
      - name: Run tests with coverage
        run: go test ./... -count=1 -race -coverprofile=coverage.out -covermode=atomic
      # Only main refreshes the cache, and only when the Go sources changed (the
      # key hashes them) — see .github/actions/setup-go-cached.
      - name: Save Go cache
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.go.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go.outputs.key }}
      # Go profiles carry module-qualified paths
      # (github.com/kerti/balances-v2/backend/...). The pip codecov-cli
      # (use_pypi) doesn't strip the module prefix the way the old binary
      # uploader did, so codecov.yml's flag paths + ignore globs (backend/…)
      # matched nothing and the backend flag reported 0%. Rewrite to
      # repo-relative paths before upload.
      - name: Normalise coverage paths for Codecov
        run: sed -i 's#github.com/kerti/balances-v2/##g' coverage.out
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.out
          flags: backend
          fail_ci_if_error: true
          use_pypi: true

  qa-matrix:
    name: QA invariant matrix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cached
        with:
          flavour: e2e
      # Strict gate: fail if any catalogued invariant lacks per-PR coverage —
      # uncovered, or covered only by a nightly (non-smoke) Playwright spec this
      # PR's gate doesn't run. -report so the read-only check never rewrites the
      # committed coverage files. See docs/qa/how-it-works.md.
      - name: Strict coverage gate
        run: go run ./tools/qa-matrix -report -strict

  gen-ts-types:
    name: Generated artifacts freshness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cached
        with:
          flavour: e2e
      # Fails if frontend/src/api/generated.types.ts doesn't match what the
      # Go source would produce — a changed nullability or an added/removed
      # column on a wire-facing struct without a matching regen. See
      # backend/tools/gen-ts-types and issue #365.
      - name: Check generated.types.ts is up to date
        run: go run ./tools/gen-ts-types -check
      # Fails if backend/internal/db differs from what the pinned sqlc
      # (backend/tools/sqlc.mod) generates — a hand edit, or a regen with a
      # different sqlc version. `sqlc diff` compares in memory. See #668.
      - name: Check sqlc output is up to date
        run: go tool -modfile=tools/sqlc.mod sqlc diff
      # Fails if docs/api-routes.md doesn't match the live router — a route
      # added/removed/renamed in a handler's Mount without a matching regen.
      # See backend/tools/gen-routes and issue #370.
      - name: Check api-routes.md is up to date
        run: go run ./tools/gen-routes -check

  backend-vuln:
    name: Backend vuln scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cached
        with:
          flavour: e2e
      # Official Go vuln scanner. Reachability-based: only fails on
      # vulnerabilities our code actually calls, not every transitive CVE.
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  image-scan:
    name: Container image scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Build once, single-platform, load into the local daemon rather than
      # push — this job only needs to scan the image, not publish it (that's
      # deploy.yml's job, on tag push).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: balances:ci-scan
      # #364 CF-21: no image scanning existed even after the GHCR publish
      # shipped (#225/#233) made a real self-host image the operator artifact.
      # ignore-unfixed skips CVEs with no available patch yet — those aren't
      # actionable by this PR and would make the gate permanently red for
      # reasons unrelated to the change under review.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: balances:ci-scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # fetch-depth: 0 — full history for Codecov merge-base resolution (see the
      # Backend test job for the rationale).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run build
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: true
          use_pypi: true

  third-party-notices:
    name: Third-party notices freshness
    runs-on: ubuntu-latest
    steps:
      # Fails if THIRD-PARTY-NOTICES is stale relative to the Go module graph or
      # the production npm deps — a dependency added/removed/bumped without a
      # matching `make licenses`. Needs both toolchains + frontend deps because
      # the generator runs go-licenses and generate-license-file. See issue #345.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cached
        with:
          flavour: e2e
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Check THIRD-PARTY-NOTICES is up to date
        run: make licenses-check
