# Reusable E2E runner (issue #70). Called by e2e.yml for both the per-PR smoke
# gate and the nightly full suite — the only difference is the `grep` input, so
# the heavy setup (Postgres service + Go + Node + Playwright) lives here once.
#
# Self-contained, no secrets: a `services: postgres` stands in for the dev
# Docker container, and `cmd/balances mock-oidc` replaces Google OAuth (ADR-0024),
# so nothing here contacts Neon, Resend, or accounts.google.com.
name: E2E run

on:
  workflow_call:
    inputs:
      tier:
        description: smoke | full — label only, drives the job/artifact name
        type: string
        required: true
      grep:
        description: Playwright args forwarded via E2E_ARGS (e.g. --grep @smoke)
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ inputs.tier }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: balances
          POSTGRES_PASSWORD: balances
          # Pre-creates the e2e DB so the Makefile's docker-exec db-create
          # (e2e-db-create) is unnecessary — e2e-ci skips it.
          POSTGRES_DB: balances_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U balances"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The Makefile derives E2E_DATABASE_URL by swapping /balances? -> /balances_e2e?,
      # so this base URL only needs the right host/creds; the base DB itself is
      # never connected to.
      DATABASE_URL: postgres://balances:balances@localhost:5432/balances?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cached
        id: go
        with:
          flavour: e2e
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      # --only-shell: CI runs headless, which uses chromium-headless-shell, not the
      # full Chrome build. Not cached: the download is ~5s; the apt system deps
      # dominate this step and can't be cached.
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps --only-shell chromium
      - name: Run E2E (${{ inputs.tier }})
        # CI=true flips Playwright into forbidOnly + retries=1 + the github
        # reporter (annotates failures inline on the PR). e2e-ci seeds the DB,
        # launches mock-oidc, and lets Playwright boot the backend + vite.
        env:
          CI: 'true'
        run: make e2e-ci E2E_ARGS="${{ inputs.grep }}"
      # Only main refreshes the cache, and only when the Go sources changed (the
      # key hashes them) — see .github/actions/setup-go-cached.
      - name: Save Go cache
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.go.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.go.outputs.key }}
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ inputs.tier }}
          path: frontend/test-results/
          retention-days: 7
