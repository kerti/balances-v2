version: 2

# Automated dependency-update PRs + security alerts. Config-only, no CI job.
# Covers all four ecosystems in play: Go modules (backend), npm (frontend),
# the GitHub Actions pinned in our workflows, and the Dockerfile base images
# (digest-pinned per #364 CF-21 — this entry is what keeps those digests from
# going stale, since a pinned digest never floats to a newer patch on its own).
#
# Every ecosystem waits 7 days after a release before proposing it: fewer PRs
# re-opened mid-batch by a fast-moving package, and a window for a compromised
# release to be pulled before we take it. Security updates ignore cooldown.
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # Collapse the dev-tooling churn (eslint, vitest, types, etc.) into one
      # PR so it doesn't drown the runtime-dependency bumps.
      dev-dependencies:
        dependency-type: development
    ignore:
      # TS7 breaks typescript-eslint@8.64's peer range (<6.1.0) and
      # i18next's (^5||^6) — re-enable once the toolchain catches up.
      - dependency-name: "typescript"
        versions: ["7.x"]
      # Runtime is pinned to Node 26 LTS (.nvmrc, CI, Dockerfile); @types/node
      # must track it, not the Current line.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # init and analyze are pinned in lockstep in codeql.yml — a version
      # mismatch between them is a hard CI failure, so they must bump together.
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # Stay on the Node 26 LTS line; take the next even major (28) by hand once it reaches LTS.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
