version: 2

# Automated dependency-update PRs + security alerts. Config-only, no CI job.
# Covers all four ecosystems in play: Go modules (backend), npm (frontend),
# the GitHub Actions pinned in our workflows, and the Dockerfile base images
# (digest-pinned per #364 CF-21 — this entry is what keeps those digests from
# going stale, since a pinned digest never floats to a newer patch on its own).
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Collapse the dev-tooling churn (eslint, vitest, types, etc.) into one
      # PR so it doesn't drown the runtime-dependency bumps.
      dev-dependencies:
        dependency-type: development
    ignore:
      # TS7 breaks typescript-eslint@8.64's peer range (<6.1.0) and
      # i18next's (^5||^6) — re-enable once the toolchain catches up.
      - dependency-name: "typescript"
        versions: ["7.x"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # init and analyze are pinned in lockstep in codeql.yml — a version
      # mismatch between them is a hard CI failure, so they must bump together.
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
