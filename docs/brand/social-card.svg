    <rect x="558" y="556" width="168" height="52" rx="26" fill="none" stroke="#334155" stroke-width="1.5"/>
    <text x="642" y="590" text-anchor="middle">Self-hosted</text>
    <rect x="742" y="556" width="204" height="52" rx="26" fill="none" stroke="#334155" stroke-width="1.5"/>
