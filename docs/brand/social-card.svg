      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="#0F172A"/>
  <circle cx="1180" cy="620" r="360" fill="url(#glow)"/>

  <!-- glyph, plated -->
  <g transform="translate(100,64)">
    <rect width="132" height="132" rx="29" fill="#111c33"/>
    <g transform="translate(25.7,27.3) scale(0.475)"><g transform="translate(-43,-39)">
      <circle cx="128" cy="58" r="13" fill="#6366F1"/>
      <rect x="124" y="71" width="8" height="42" rx="4" fill="#E2E8F0"/>
      <rect x="52" y="108" width="152" height="10" rx="5" fill="#E2E8F0"/>
      <rect x="69" y="118" width="4" height="22" fill="#475569"/>
      <rect x="183" y="118" width="4" height="22" fill="#475569"/>
      <rect x="49"  y="140" width="44" height="16" rx="3" fill="#6366F1"/>
      <rect x="49"  y="160" width="44" height="16" rx="3" fill="#818CF8"/>
      <rect x="49"  y="180" width="44" height="16" rx="3" fill="#A5B4FC"/>
      <rect x="163" y="140" width="44" height="16" rx="3" fill="#334155"/>
